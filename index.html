<!DOCTYPE html>
<html lang="en" data-rs-gate>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MISMO Initiative Hub</title>
<script>
  // Before any CSS paints: the saved theme, and whether the sections were narrowed, so
  // neither flashes. Deliberately tiny and synchronous.
  (function(){
    try {
      if (localStorage.getItem('resources:hub:theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      if (localStorage.getItem('resources:hub:rail') === 'mini') document.documentElement.classList.add('railmini');
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Libre+Franklin:wght@400;500;600;700&display=swap">
<style>
  /* Summit HQ's own tokens, as the admin panel wears them. Every colour on the page comes
     from here, so dark mode is a second block rather than a hunt through the rules. */
  :root{
    --navy:#0f314c; --navy-deep:#06202f; --navy-mid:#14486e; --sky:#50a4db; --sky-soft:#94c8e9;
    --paper:#F1F6FA; --surface:#FFFFFF; --sunk:#E9F1F8;
    --ink:#0f314c; --ink-2:#456179; --ink-3:#546F88;
    --line:#E5EEF5; --line-2:#D5E2ED; --line-3:#ADC4D6;
    --accent:#14486E; --accent-soft:#dcedf8;
    --good:#0F7B5C; --good-soft:#E1F2EC;
    --warn-ink:#8A5F16; --warn-soft:#F7EFE0;
    --btn:#0f314c; --btn-ink:#FFFFFF;
    --shadow-s:0 1px 2px rgba(15,49,76,.06);
    --shadow:0 1px 2px rgba(15,49,76,.06), 0 10px 26px -18px rgba(15,49,76,.45);
    /* Libre Franklin, as this page has always used (Perry, 29 Sept), rather than Summit HQ's IBM Plex.
       The shared account button asks for it too, so the two now match. */
    --font:"Libre Franklin",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --hq-h:64px; --rail-w:240px; --rail-mini:62px;
    /* The domains keep their own colours (the color tour depends on them). */
    --brand:#2A4DFF; --teal:#0E9488; --gold:#D97706; --rose:#C2255C; --violet:#7C3AED; --fuchsia:#C026D3;
    --graphite:#475569; --emerald:#059669; --cyan:#0891B2; --indigo:#4F46E5; --crimson:#9F1239;
    /* A potential initiative's stage, one colour each, in this palette */
    --s-not-started:#546F88; --s-in-progress:#2C74A6; --s-in-approvals:#8A5F16; --s-kickoff-set:#14486E; --s-launched:#0F7B5C;
    color-scheme:light;
  }
  html[data-theme="dark"]{
    --paper:#0B1826; --surface:#112336; --sunk:#172D44;
    --ink:#EEF3F8; --ink-2:#B9C8D6; --ink-3:#8C9FB1;
    --line:#1A3048; --line-2:#243E5A; --line-3:#3A5A7C;
    --accent:#50A4DB; --accent-soft:#173A57;
    --good:#72C08E; --good-soft:#1F3328;
    --warn-ink:#E0A83C; --warn-soft:#3A3020;
    --btn:#50A4DB; --btn-ink:#0F314C;
    --shadow-s:0 1px 2px rgba(0,0,0,.45);
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 26px -18px rgba(0,0,0,.9);
    --brand:#5B85FF; --teal:#14B8A6; --gold:#F0930D; --rose:#E0417A; --violet:#9660F5; --fuchsia:#D946E4;
    --graphite:#64748B; --emerald:#22C55E; --cyan:#22D3EE; --indigo:#818CF8; --crimson:#FB7185;
    --s-not-started:#8C9FB1; --s-in-progress:#50A4DB; --s-in-approvals:#E0A83C; --s-kickoff-set:#A3CDE7; --s-launched:#72C08E;
    color-scheme:dark;
    /* Deep Circuit dark mode (29 Sept) */
    --bad:#F08579; --bad-soft:#3D2220; --scrim:rgba(0,0,0,.65);
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;
    -webkit-font-smoothing:antialiased;
    padding-top:calc(var(--hq-h) + env(safe-area-inset-top,0px));padding-left:var(--rail-w)}
  html.railmini body{padding-left:var(--rail-mini)}
  svg.i{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* ───────── the masthead, as Summit HQ wears it ───────── */
  .hqtop{position:fixed;top:0;left:0;right:0;z-index:30;height:calc(var(--hq-h) + env(safe-area-inset-top,0px));
    padding:env(safe-area-inset-top,0px) 22px 0;background:var(--navy);color:#fff;display:flex;align-items:center;
    box-shadow:0 1px 0 rgba(80,164,219,.28)}
  .logoplate{background:#fff;border-radius:5px;padding:9px 13px;display:flex;align-items:center;line-height:0;
    flex:0 0 auto;box-shadow:0 1px 0 rgba(80,164,219,.35)}
  .logoplate svg{height:24px;width:auto;display:block}
  .mastrule{display:block;width:2px;height:34px;flex:0 0 auto;margin-inline:20px;border-radius:1px;background:var(--sky)}
  .hqname{font-size:15.5px;font-weight:700;letter-spacing:-.005em;color:var(--sky);white-space:nowrap;
    min-width:0;overflow:hidden;text-overflow:ellipsis}
  .hqtop-r{margin-left:auto;display:flex;align-items:center;gap:13px;flex:0 0 auto}
  .eyebrow-m{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.62);font-weight:600;white-space:nowrap}

  /* ───────── the sections, down the left ───────── */
  .rail{position:fixed;left:0;bottom:0;top:calc(var(--hq-h) + env(safe-area-inset-top,0px));width:var(--rail-w);z-index:20;
    background:var(--navy);color:#fff;display:flex;flex-direction:column;overflow:hidden auto;
    box-shadow:1px 0 0 rgba(80,164,219,.22), 4px 0 18px rgba(6,32,47,.14)}
  html.railmini .rail{width:var(--rail-mini)}
  .rail-top{display:flex;align-items:center;gap:8px;padding:11px 10px 9px;border-bottom:1px solid rgba(80,164,219,.2)}
  .rail-lbl{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.55);padding-left:3px}
  .railhide{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.18);border-radius:5px;
    color:rgba(255,255,255,.75);width:24px;height:24px;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
  .railhide svg{width:16px;height:16px}
  .railhide:hover{background:rgba(255,255,255,.14);color:#fff}
  .railfind{position:relative;padding:11px 12px 3px}
  .railfind svg{position:absolute;left:21px;top:20px;width:14px;height:14px;stroke:rgba(255,255,255,.5);pointer-events:none}
  .railfind input{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
    border-radius:6px;color:#fff;font:inherit;font-size:12.5px;padding:6px 10px 6px 30px}
  .railfind input::placeholder{color:rgba(255,255,255,.5)}
  .railfind input:focus{outline:2px solid var(--sky);outline-offset:-1px;background:rgba(255,255,255,.16)}
  .rail nav{display:flex;flex-direction:column;gap:1px;padding:8px 8px 4px}
  .rail nav button,.rail nav a,.theme-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;
    border-radius:6px;color:rgba(255,255,255,.76);padding:8px 10px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;
    white-space:nowrap;text-decoration:none}
  .rail nav button svg,.rail nav a svg,.theme-btn svg{width:17px;height:17px;flex:0 0 auto;opacity:.85}
  .rail nav button:hover,.rail nav a:hover,.theme-btn:hover{color:#fff;background:rgba(255,255,255,.09)}
  .rail nav button[aria-current]{color:#fff;font-weight:600;background:var(--navy-mid);box-shadow:inset 3px 0 0 var(--sky)}
  .rail nav button[aria-current] svg{opacity:1;stroke:var(--sky)}
  .rail nav button:focus-visible,.rail nav a:focus-visible,.theme-btn:focus-visible,.railhide:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
  .rail nav .count{margin-left:auto;font-style:normal;font-size:11px;font-weight:600;color:rgba(255,255,255,.6);
    background:rgba(255,255,255,.1);border-radius:999px;padding:0 7px;line-height:18px}
  .rail nav .count:empty{display:none}
  .rail .foot{margin-top:auto;padding:8px 8px 10px;border-top:1px solid rgba(80,164,219,.2);display:flex;flex-direction:column;gap:1px}
  /* narrowed: icons only, the chevron turned round to open it again */
  html.railmini .rail-top{justify-content:center;padding-inline:0}
  html.railmini .railhide{margin:0}
  html.railmini .railhide svg{transform:scaleX(-1)}
  html.railmini .rail-lbl,html.railmini .railfind,html.railmini .rail nav span,html.railmini .rail nav .count,
  html.railmini .theme-btn span{display:none}
  html.railmini .rail nav{padding-inline:6px;align-items:center}
  html.railmini .rail nav button,html.railmini .rail nav a,html.railmini .theme-btn{justify-content:center;padding:10px 0;width:42px}
  html.railmini .rail .foot{align-items:center}

  /* ───────── the page ───────── */
  main{max-width:1180px;padding:22px 24px 48px;min-width:0}
  .view{display:flex;flex-direction:column;gap:14px}
  .mast{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;
    border-bottom:2px solid var(--ink);padding-bottom:14px}
  .mast > div{min-width:0}
  .eyebrow{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .mast h1{font-size:clamp(22px,3vw,32px);font-weight:700;letter-spacing:-.02em;line-height:1.05;margin:2px 0 0;text-wrap:balance}
  .mast .sub{color:var(--ink-2);font-size:13px;margin-top:5px;max-width:78ch}
  .btn{font:inherit;font-size:13px;font-weight:600;border-radius:4px;padding:7px 14px;cursor:pointer;white-space:nowrap;
    border:1px solid var(--line-2);background:var(--surface);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center}
  .btn:hover{border-color:var(--line-3)}
  .btn.p{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
  .btn:focus-visible{outline:2px solid var(--sky);outline-offset:2px}

  /* ───────── the domains ───────── */
  .tile-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  @media (max-width:1280px){.tile-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (max-width:1000px){.tile-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:520px){.tile-grid{grid-template-columns:1fr}}
  .domain-tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;font:inherit;color:var(--ink);
    background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:14px 16px;box-shadow:var(--shadow-s);cursor:pointer;
    transition:border-color .15s ease, box-shadow .15s ease}
  .domain-tile:hover{border-color:var(--line-3)}
  .domain-tile.active{border:2px solid var(--tile-color);padding:13px 15px;box-shadow:var(--shadow)}
  .domain-tile:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
  .tile-top-row{display:flex;align-items:center;gap:10px}
  .tile-icon-wrap,.panel-icon-wrap{border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
    background:var(--tile-soft);color:var(--tile-color);transition:background .15s ease, color .15s ease}
  html[data-theme="dark"] .tile-icon-wrap,html[data-theme="dark"] .panel-icon-wrap{background:color-mix(in srgb, var(--tile-color) 20%, transparent)}
  .tile-icon-wrap{width:34px;height:34px}
  .tile-icon-wrap svg{width:18px;height:18px}
  .tile-name{font-size:14.5px;font-weight:700;letter-spacing:-.005em}
  .tile-desc{font-size:12.5px;color:var(--ink-2);line-height:1.4}
  .tile-count{font-size:12px;font-weight:600;color:var(--ink-3);margin-top:auto}
  /* The color tour: each tile lights in its domain's colour in turn. */
  .domain-tile.intro-highlight{border-color:var(--tile-color);background:var(--tile-soft);transition:border-color .6s ease, background .6s ease}
  .domain-tile.intro-highlight-slow{border-color:var(--tile-color);background:var(--tile-soft);transition:border-color .65s ease, background .65s ease}
  html[data-theme="dark"] .domain-tile.intro-highlight,html[data-theme="dark"] .domain-tile.intro-highlight-slow{background:color-mix(in srgb, var(--tile-color) 16%, var(--surface))}
  .domain-tile.intro-highlight .tile-icon-wrap{background:var(--tile-color);color:#fff;transition:background .6s ease, color .6s ease}
  .domain-tile.intro-highlight-slow .tile-icon-wrap{background:var(--tile-color);color:#fff;transition:background .65s ease, color .65s ease}

  /* ───────── a domain's initiatives, and search results ───────── */
  #panelArea{scroll-margin-top:calc(var(--hq-h) + 16px)}
  .panel{display:flex;flex-direction:column;gap:12px;margin-top:6px}
  .panel-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .panel-icon-wrap{width:30px;height:30px;border-radius:7px}
  .panel-icon-wrap svg{width:17px;height:17px}
  .panel-title{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
  .panel-sub{font-size:12.5px;color:var(--ink-3);font-weight:600}
  .panel-head .btn{margin-left:auto}

  .init-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  @media (max-width:1000px){.init-grid{grid-template-columns:1fr}}
  .init-card{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:16px 18px 12px;
    display:flex;flex-direction:column;box-shadow:var(--shadow-s)}
  /* The description stretches so every collapsed card in a row lines its buttons up at the
     bottom. Once a card is expanded the buttons move to the end (order:10), so it stops. */
  .detail-block-grow{flex:1;min-height:0}
  .init-card.expanded .detail-block-grow{flex:0 0 auto}
  .init-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .init-title{font-size:15px;font-weight:700;letter-spacing:-.005em;color:var(--ink)}
  .metastrip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
  .mlab{font-size:11.5px;font-weight:600;color:var(--ink-3)}
  .msep{width:1px;height:14px;background:var(--line-2);flex:0 0 auto}
  .tag{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:0 9px;line-height:20px;border-radius:999px;white-space:nowrap}
  .st-pub{background:var(--good-soft);color:var(--good)}
  .st-dev{background:var(--warn-soft);color:var(--warn-ink)}
  .st-app{background:var(--accent-soft);color:var(--accent)}
  .facchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);font-weight:500;white-space:nowrap}
  .facchip .fac-av{width:20px;height:20px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-size:9.5px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
  .facnone{font-size:12.5px;color:var(--ink-3);font-style:italic}
  .sample-badge{font-size:11px;font-weight:600;border:1px dashed var(--line-3);color:var(--ink-3);border-radius:999px;
    padding:0 8px;line-height:18px;white-space:nowrap}
  .detail-block{margin-top:14px}
  .detail-label{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:3px}
  .detail-text{font-size:13px;color:var(--ink-2);margin:0;line-height:1.5}
  .detail-text.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .init-card.expanded .detail-text.clamp{display:block;-webkit-line-clamp:unset;overflow:visible}
  .why-bullets{margin:0;padding-left:16px;font-size:13px;color:var(--ink-2);line-height:1.5}
  .snapshot-stat{font-size:13px;font-weight:600;color:var(--ink);margin:0}
  .card-actions-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding-top:10px;border-top:1px solid var(--line)}
  .init-card.expanded .card-actions-row{order:10}
  /* "View dashboard" and "Open initiative": a filled blue button, as before, in this palette */
  .view-link{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:4px;font-size:13px;font-weight:600;
    text-decoration:none;white-space:nowrap;background:#2C74A6;color:#fff}
  html[data-theme="dark"] .view-link{background:#50a4db;color:#06202f}
  .view-link:hover{filter:brightness(1.12)}
  .view-link:focus-visible,.expand-toggle:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:2px}
  .view-link-disabled{display:inline-flex;align-items:center;padding:6px 13px;border-radius:4px;border:1px dashed var(--line-3);
    font-size:13px;color:var(--ink-3);font-style:italic;white-space:nowrap}
  .expand-toggle{margin-left:auto;display:inline-flex;align-items:center;gap:5px;background:none;border:0;padding:4px 0;
    font:inherit;font-size:12.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
  .expand-toggle:hover{color:var(--ink)}
  .expand-chevron{font-size:10px;transition:transform .15s ease}
  .expand-chevron.open{transform:rotate(180deg)}
  .expand-body{display:none}
  .expand-body.open{display:block}
  .none-yet{color:var(--ink-3) !important;font-style:italic}
  .empty-hint{font-size:13px;color:var(--ink-3);text-align:center;padding:26px 0}

  /* ───────── Potential Initiatives ───────── */
  .steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin:10px 0 0}
  .step{font-size:10px;line-height:1.15;font-weight:600;color:var(--ink-3);text-align:center}
  .step::before{content:'';display:block;height:4px;border-radius:2px;background:var(--line-2);margin-bottom:4px}
  .step.on{font-weight:700;color:var(--s-in-progress)} .step.on::before{background:var(--s-in-progress)}
  .step.on.s-not-started{color:var(--s-not-started)} .step.on.s-not-started::before{background:var(--s-not-started)}
  .step.on.s-in-approvals{color:var(--s-in-approvals)} .step.on.s-in-approvals::before{background:var(--s-in-approvals)}
  .step.on.s-kickoff-set{color:var(--s-kickoff-set)} .step.on.s-kickoff-set::before{background:var(--s-kickoff-set)}
  .step.on.s-launched{color:var(--s-launched)} .step.on.s-launched::before{background:var(--s-launched)}
  .pot-empty{background:var(--surface);border:1px dashed var(--line-3);border-radius:8px;padding:48px 24px;text-align:center;color:var(--ink-3);font-size:13.5px}
  .pot-empty strong{display:block;font-size:16px;color:var(--ink);margin-bottom:6px}

  /* phone width: the sections shrink to icons, as Summit HQ's do */
  @media (max-width:760px){
    :root{--hq-h:55px;--rail-w:58px;--rail-mini:58px}
    .hqtop{padding-inline:12px}
    .logoplate{padding:7px 10px}
    .logoplate svg{height:18px}
    .mastrule{height:30px;margin-inline:10px}
    .hqname{font-size:13px}
    .eyebrow-m{display:none}
    .railhide{display:none}
    .rail-lbl,.railfind,.rail nav span,.rail nav .count,.theme-btn span{display:none}
    .rail-top{justify-content:center;padding-inline:0;min-height:12px}
    .rail nav{padding-inline:6px;align-items:center}
    .rail nav button,.rail nav a,.theme-btn{justify-content:center;padding:10px 0;width:42px}
    .rail .foot{align-items:center}
    main{padding:16px 16px 28px}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }

  /* Work Requests, in every Hub page's sidebar (Sept 30, 2026). Shown to people with access. */
  .rail .wr-group{border-top:1px solid rgba(80,164,219,.16);margin-top:4px;padding-top:7px}
  .rail .wr-group[hidden]{display:none}
  .rail .wr-group > span{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.52);font-weight:700;padding:4px 20px 2px}
  html.railmini .rail .wr-group > span{display:none}
  @media (max-width:760px){ .rail .wr-group > span{display:none} }
/* ===== The initiative library, redone (Perry, 6 Nov 2026; canvas page "Initiative Library: New Designs", B1): the
   dashboards' header; eight lifecycle domains A to Z, each one line that opens to narrow cards; pins; a stakeholder
   type filter; search across names and stakeholder types. ===== */
.view.lib{gap:0;padding:0}
.lb-band{position:relative;overflow:hidden;border-radius:16px;background:linear-gradient(120deg,#0F314C 0%,#14486E 58%,#0F7A86 135%);color:#fff;padding:22px 26px 0}
.lb-band .waves{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.16}
.lb-row{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.lb-eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#94C8E9}
.lb-band h1{font-family:Archivo,'Libre Franklin',sans-serif;font-size:32px;font-weight:800;letter-spacing:-.02em;margin:6px 0 0;color:#fff}
.lb-band .lb-sub{color:#cfe3f1;font-size:14px;margin:6px 0 0;max-width:640px}
.lb-band .btn.lb-new{background:#fff;color:#0F314C;border-color:#fff;white-space:nowrap}
.lb-stats{position:relative;display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
.lb-stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:9px 14px;min-width:120px}
.lb-stat b{display:block;font-family:Archivo,sans-serif;font-size:23px;font-weight:800;line-height:1.1;color:#fff} .lb-stat span{font-size:12px;color:#a9c7dc}
.lb-search{position:relative;margin-top:16px;max-width:640px;display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:10px 14px;color:#546F88;box-shadow:0 10px 30px -12px rgba(0,0,0,.4)}
.lb-search input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:15px;color:#0F314C;background:transparent}
.lb-search kbd{font-size:11px;border:1px solid #D5E2ED;border-radius:5px;padding:1px 6px;color:#546F88}
.lb-search:focus-within{box-shadow:0 0 0 3px rgba(116,191,235,.6),0 10px 30px -12px rgba(0,0,0,.4)}
.lb-tabs{position:relative;display:flex;gap:10px;margin:18px -26px 0;padding:8px 26px 0;background:rgba(5,22,36,.28);border-top:1px solid rgba(255,255,255,.08);overflow-x:auto}
.lb-tab{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:10px 18px 11px;border-radius:11px 11px 0 0;font-size:13.5px;font-weight:600;color:#cfe3f1;white-space:nowrap}
.lb-tab:hover{color:#fff} .lb-tab[aria-selected="true"]{background:var(--paper);color:var(--ink);font-weight:700}
.lb-tab .n{font-size:11px;background:rgba(255,255,255,.16);border-radius:999px;padding:0 7px} .lb-tab[aria-selected="true"] .n{background:var(--sunk)}
.lb-tab:focus-visible{outline:2px solid #74BFEB;outline-offset:-2px}
.lb-body{padding:18px 0 32px}
.lb-pins{background:var(--surface);border:1px solid var(--line-2);border-radius:16px;padding:14px 16px;margin-bottom:16px}

.lb-sech{display:flex;align-items:center;gap:10px;margin:0 0 10px;flex-wrap:wrap} .lb-sech h2{font-family:Archivo,sans-serif;font-size:17px;margin:0} .lb-sech span{color:var(--ink-3);font-size:13px}
.lb-tools{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.lb-tools .grow{flex:1}
.lb-tools label{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.lb-sel{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;background:var(--surface);color:var(--ink-2);min-height:34px}
.lb-sel.stk{min-width:240px}
.lb-btn2{font:inherit;font-size:12.5px;font-weight:700;border:1px solid var(--line-3);border-radius:8px;padding:6px 12px;background:var(--surface);color:var(--accent);cursor:pointer;min-height:34px}
.lb-res{display:flex;align-items:center;gap:12px;background:#0F314C;color:#fff;border-radius:12px;padding:9px 12px 9px 16px;margin-bottom:10px;font-size:13.5px}
.lb-res[hidden]{display:none} .lb-res b{color:#94C8E9} .lb-res .lb-btn2{margin-left:auto}
.lb-dom{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;margin-bottom:8px;overflow:hidden;transition:background .6s ease,border-color .6s ease}
.lb-dom.none{opacity:.5}
.lb-dom-h{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:22px 34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px}
.lb-dom-h:focus-visible{outline:2px solid var(--sky,#74BFEB);outline-offset:-2px;border-radius:14px}
.lb-dom-h .chev{color:var(--ink-2);transition:transform .2s ease;display:inline-flex} .lb-dom.open .lb-dom-h .chev{transform:rotate(90deg)}
.lb-sw{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:Archivo,sans-serif;font-weight:800;font-size:13px;background:var(--dc)}
.lb-nm b{display:block;font-family:Archivo,sans-serif;font-size:15.5px;color:var(--ink)} .lb-nm span{font-size:12px;color:var(--ink-3)}
.lb-rgt{display:flex;align-items:center;gap:14px;justify-content:flex-end}
.lb-cnt{font-size:12.5px;color:var(--ink-2);white-space:nowrap;text-align:right} .lb-cnt b{color:var(--ink)} .lb-cnt .none{color:var(--ink-3);font-style:italic}
.lb-strip{display:flex;gap:4px}
.lb-strip i{width:22px;height:22px;border-radius:6px;display:block;box-sizing:border-box;background:var(--dc)}
.lb-strip i.dev{opacity:.55}
.lb-strip i.pot{background:color-mix(in srgb,var(--dc) 16%,var(--surface));border:1.5px dashed color-mix(in srgb,var(--dc) 50%,var(--surface))}
.lb-strip i.faded{opacity:.18}
.lb-dom-b{padding:2px 14px 14px 82px}
.lb-cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.lb-card{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-height:92px;padding:11px 12px;border-radius:12px;color:#fff;text-decoration:none;box-shadow:0 10px 22px -18px rgba(15,49,76,.7);
  background:linear-gradient(135deg,color-mix(in srgb,var(--dc) 45%,#0F314C) 0%,var(--dc) 115%);transition:transform .15s ease,box-shadow .15s ease;cursor:pointer;font:inherit;text-align:left;border:0}
.lb-card:hover{transform:translateY(-2px);box-shadow:0 14px 26px -16px rgba(15,49,76,.75)}
.lb-card:focus-visible{outline:3px solid var(--sky,#74BFEB);outline-offset:2px}
.lb-card b{font-family:Archivo,sans-serif;font-size:13.5px;font-weight:800;line-height:1.25;padding-right:30px}
.lb-card .st{align-self:flex-start;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:2px 8px;white-space:nowrap}
.lb-card .st.pub{background:#E3F3EC;color:#0b5c44} .lb-card .st.dev{background:#FBF1DE;color:#7a5413} .lb-card .st.app{background:#E4F2FB;color:#14486E}
.lb-card .mt{font-size:11.5px;font-weight:700;margin-top:-2px}
.lb-card.pot{color:var(--ink);background:color-mix(in srgb,var(--dc) 14%,var(--surface));border:1.5px dashed color-mix(in srgb,var(--dc) 50%,var(--surface));box-shadow:none}
.lb-card.pot .st{background:var(--surface);color:color-mix(in srgb,var(--dc) 60%,var(--ink))}
.lb-card[hidden]{display:none}
.lb-pin{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;z-index:1}
.lb-card.pot .lb-pin{border-color:var(--line-2);background:var(--surface);color:var(--ink-3)}
.lb-pin[aria-pressed="true"]{background:#DCEDF8;border-color:#DCEDF8;color:#14486E} .lb-pin[aria-pressed="true"] path{fill:currentColor}
.lb-pin:focus-visible{outline:2px solid var(--sky,#74BFEB);outline-offset:1px}
.lb-empty{font-size:12.5px;color:var(--ink-3);font-style:italic}
.lb-dom.intro-highlight{border-color:var(--dc);background:color-mix(in srgb,var(--dc) 12%,var(--surface))}
.lb-dom.intro-highlight .lb-sw{transform:scale(1.08);transition:transform .3s ease}
dialog.lb-dlg{border:0;border-radius:16px;padding:0;max-width:min(560px,calc(100vw - 32px));width:100%;background:var(--surface);color:var(--ink);box-shadow:0 24px 60px -20px rgba(6,32,47,.6)}
dialog.lb-dlg::backdrop{background:rgba(6,32,47,.45)}
.lb-dlg .dh{padding:18px 20px;color:#fff;background:linear-gradient(120deg,color-mix(in srgb,var(--dc) 45%,#0F314C),var(--dc) 140%)}
.lb-dlg .dh h3{font-family:Archivo,sans-serif;font-size:19px;margin:6px 0 0}
.lb-dlg .db{padding:16px 20px 20px} .lb-dlg .db h4{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 4px} .lb-dlg .db p{margin:0;line-height:1.55}
.lb-dlg .db ul{margin:0;padding-left:18px} .lb-dlg .acts{display:flex;justify-content:flex-end;padding:0 20px 18px}
@media (max-width:1100px){ .lb-cards{grid-template-columns:repeat(4,minmax(0,1fr))} }
@media (max-width:700px){ .lb-band{padding:18px 16px 0;border-radius:12px} .lb-tabs{margin:16px -16px 0;padding:8px 16px 0} .lb-band h1{font-size:25px}
  .lb-dom-h{grid-template-columns:18px 30px minmax(0,1fr);row-gap:6px} .lb-rgt{grid-column:3;justify-content:flex-start} .lb-dom-b{padding-left:14px}
  .lb-cards{grid-template-columns:repeat(2,minmax(0,1fr))} .lb-sel.stk{min-width:0;flex:1} }
@media (prefers-reduced-motion: reduce){ .lb-card,.lb-dom,.lb-dom-h .chev{transition:none} .lb-card:hover{transform:none} }

.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

<script>
  function escapeHtml(v){ return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  const initiatives = [
    {
      title: 'Mortgage Compliance Dataset', lifecycle: 'pub', facilitator: 'Erin Bittenbender', domains: ['Mortgage Compliance'], status: 'live', href: 'mcd-dashboard.html', sample: false,
      whatIsIt: 'A standard set of loan data fields and delivery file format that mortgage lenders and independent mortgage banks provide to regulators for the loan-level review portion of regulatory compliance examinations — designed to replace the Loan Examination File (LEF).',
      whyWorking: ['Manual, inconsistent reviews slow examinations down.', 'Inconsistent formats break compliance technology.', 'Lenders want to catch issues before the exam.'],
      whoBroughtIt: 'MISMO, in partnership with CSBS · sponsored by Asurity · Version 2.0 published Dec 11, 2025',
      publicationStatus: 'Published — Version 2.0',
      estimatedSavings: 'No published $ estimate yet'
    },
    {
      title: 'Common Confidence Score', lifecycle: 'pub', facilitator: 'Kellie Stoll', domains: ['Originations', 'Valuation'], status: 'live', href: 'ccs-dashboard.html', sample: false,
      whatIsIt: 'A standardized probability score — the estimated likelihood an AVM value falls within ±10% of market value — that lets lenders and investors compare valuation risk across different AVM providers on one common scale, replacing inconsistent provider-specific confidence formats.',
      whyWorking: ['Inconsistent scores make AVMs hard to compare.', 'The accurate alternative is too complex to adopt.', 'A 2024 federal rule raised the stakes.'],
      whoBroughtIt: 'AVM providers &amp; the Mortgage Bankers Association, in response to the CFPB\'s AVM quality control rule — though that rule is not currently being enforced · Reached Recommendation status April 21, 2026',
      publicationStatus: 'Published — though the federal rule it responds to is not currently being enforced',
      estimatedSavings: 'No published $ figure — sources describe reduced QC costs and faster valuation decisions only'
    },
    {
      title: 'Title Order Dataset Specification', lifecycle: 'dev', facilitator: 'Kellie Stoll', domains: ['Title & Closing'], status: 'planned', href: 'title-order-dashboard.html', sample: false,
      whatIsIt: 'A standardized dataset for exchanging title order information, so a lender placing a title order sends the same structured set of fields every time rather than an email, an attachment, a contract, a phone call or a fax. Covers refinance, purchase and home equity transactions.',
      whyWorking: ['Title orders arrive through inconsistent channels — structured and unstructured emails, attachments, contracts, phone calls and faxes — producing data gaps and errors that delay order initiation.', 'Title providers cannot import orders cleanly, so orders are rekeyed into Title Production Systems rather than brought straight in.', 'It completes the MISMO suite of title and closing dataset specifications, from pricing through fulfilment, and lays the groundwork for SMART Doc\\u00ae integration.'],
      whoBroughtIt: 'Stewart Lender Services (Marvin Stone) and ALTA (Steve Gold), through the Title and Closing Community of Practice',
      publicationStatus: 'Work request WR2025_22 submitted — expected 1 November 2026',
      estimatedSavings: 'No published $ figure yet'
    },
    {
      title: 'Title and Closing Dataset Specifications', lifecycle: 'pub', facilitator: 'Kellie Stoll', domains: ['Title & Closing'], status: 'live', href: 'title-closing-dashboard.html', sample: false,
      whatIsIt: 'Six dataset specifications that let title and closing documents move between parties as data rather than as documents: the ALTA Title Commitment, the ALTA Closing Protection Letter, the Fee Sheet, Title Endorsements, the ALTA Settlement Statement and the ALTA Title Policy. Adoption is tracked part by part.',
      whyWorking: ['Title documents still travel as PDFs and paper, and each party rekeys them, which adds manual work, errors and delay.', 'One standard lets lenders, title companies, settlement agents and their systems exchange the same data without bespoke integrations.', 'Consistent data makes for smoother closings and servicing transfers.'],
      whoBroughtIt: 'The Title and Closing Docs to Data DWG (Chair: Bryan Bedard, Rocket Close); the Settlement Statement and Title Policy in partnership with ALTA · carried forward by the Title and Closing Community of Practice',
      publicationStatus: 'Candidate Recommendations — four published October 24, 2023; two March 24, 2026',
      estimatedSavings: 'No published $ figure yet'
    },
    {
      title: 'AVM Testing Guidance and Best Practices', lifecycle: 'pub', facilitator: 'Kellie Stoll', domains: ['Valuation'], status: 'planned', href: 'avm-testing-dashboard.html', sample: false,
      whatIsIt: 'A best-practice guide for lenders testing the AVMs they rely on, covering both accuracy testing and Common Confidence Score testing — a repeatable method for benchmark selection, data leakage, temporal matching and the metrics to compute.',
      whyWorking: ['Federal rules require regular accuracy testing to use AVMs, but smaller lenders often lack the resources to build their own process.', 'Without shared guidelines, each lender rebuilds the same testing framework independently, raising costs that get passed on to consumers.', 'Standardized practices lower the barrier to AVM adoption for smaller institutions.'],
      whoBroughtIt: 'The same AVM DWG that developed the Common Confidence Score — AVM providers, testers, and lenders, in response to the federal AVM quality control rule',
      publicationStatus: 'Published — 17 September 2026',
      estimatedSavings: 'No published $ figure — reduces the cost of building a testing process from scratch'
    },
    {
      title: 'AVM Fairness Testing Guidelines', lifecycle: 'dev', facilitator: 'Kellie Stoll', domains: ['Valuation'], status: 'planned', href: null, sample: false,
      whatIsIt: 'Best-practice guidelines for testing AVMs for discriminatory patterns — disparate treatment and disparate impact — giving small and mid-sized lenders a baseline for fair-lending compliance without building their own testing process from scratch.',
      whyWorking: ['Federal rules require regular fairness testing to use AVMs, but smaller lenders often lack the resources to build their own process.', 'Compliance with non-discrimination laws can be resource-intensive, leading some lenders to avoid AVMs entirely rather than build a program.', 'A shared framework reduces both cost and legal risk for smaller institutions.'],
      whoBroughtIt: 'The same AVM DWG that developed the Common Confidence Score — AVM providers, testers, and lenders, in response to the federal AVM quality control rule',
      publicationStatus: 'In progress',
      estimatedSavings: 'No published $ figure — reduces the cost of building a testing process from scratch'
    },
    {
      title: 'Property &amp; Valuation Services Procurement Dataset', lifecycle: 'pub', facilitator: 'Kellie Stoll', domains: ['Valuation'], status: 'planned', href: null, sample: false,
      whatIsIt: 'A common framework for exchanging transactional appraisal order information, built around the new terminology introduced by the FHFA\'s Uniform Mortgage Data Program (UMDP) Uniform Appraisal Dataset (UAD) 3.6 — replacing reliance on the retired Fannie Mae/Freddie Mac numbered appraisal form templates, now consolidated into the new Uniform Residential Appraisal Report (URAR).',
      whyWorking: ['UAD 3.6 retires the old Fannie/Freddie form templates, so the industry needs a new shared format for appraisal order data.', 'Without a common specification, each lender and AMC would build incompatible integrations for the same transition.', 'A shared dataset keeps procurement data consistent across lenders, AMCs, and technology providers.'],
      whoBroughtIt: 'Property and Valuation Services (PaVS) Community of Practice',
      publicationStatus: 'Published',
      estimatedSavings: 'No published $ figure yet'
    },
    {
      title: 'MISMO FRAME', lifecycle: 'pub', facilitator: 'Erin Bittenbender', domains: ['Artificial Intelligence', 'Governance'], status: 'planned', href: null, sample: false,
      whatIsIt: 'An AI governance toolkit — five practical artifacts (Governance Policy, AI System Inventory, and System Risk Assessment now available; Performance &amp; Fairness Testing and an Incident &amp; Change Management Log deferred) built on the NIST AI Risk Management Framework and tailored to mortgage-specific rules like ECOA, the Fair Housing Act, and SR 11-7.',
      whyWorking: ['No shared AI governance framework existed for mortgage lending specifically.', 'Fair lending laws raise real compliance risk for ungoverned AI use.', 'Industry asked MISMO to lead, rather than each lender building its own framework.'],

    qi.addEventListener('input', () => { q = qi.value.trim().toLowerCase(); if (railQ) railQ.value = qi.value; render(); });
    const sel = document.getElementById('libStk'); sel.addEventListener('change', () => { stk = sel.value; render(); });
    const ord = document.getElementById('libOrder'); ord.addEventListener('change', () => { order = ord.value; store.set('resources:hub:library-order', order); render(); });
    document.getElementById('libOpenAll').addEventListener('click', () => { folded = new Set(); store.set('resources:hub:library-folded', []); render(); });
    document.getElementById('libCloseAll').addEventListener('click', () => { folded = new Set(LIB_DOMAINS.map(d => d.name)); store.set('resources:hub:library-folded', [...folded]); render(); });
    const clr = document.getElementById('libClear'); if (clr) clr.addEventListener('click', () => { q = ''; stk = ''; if (railQ) railQ.value = ''; render(); document.getElementById('libQ').focus(); });
    libView.querySelectorAll('[data-fold]').forEach(b => b.addEventListener('click', () => { const n = b.dataset.fold;
      folded.has(n) ? folded.delete(n) : folded.add(n); store.set('resources:hub:library-folded', [...folded]); render();
      const nb = libView.querySelector(`[data-fold="${CSS.escape(n)}"]`); if (nb) nb.focus(); }));
    libView.querySelectorAll('[data-pin]').forEach(b => b.addEventListener('click', ev => { ev.preventDefault(); ev.stopPropagation(); const k = b.dataset.pin;
      pins = pins.includes(k) ? pins.filter(x => x !== k) : [...pins, k]; store.set('resources:hub:library-pins', pins); render();
      const nb = libView.querySelector(`.lb-dom [data-pin="${CSS.escape(k)}"]`) || libView.querySelector(`[data-pin="${CSS.escape(k)}"]`); if (nb) nb.focus(); }));
    libView.querySelectorAll('[data-details]').forEach(c => { const open = () => details(c.dataset.details);
      c.addEventListener('click', ev => { if (!ev.target.closest('[data-pin]')) open(); });
      c.addEventListener('keydown', ev => { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target === c) { ev.preventDefault(); open(); } }); });
  }
  document.querySelectorAll('.rail nav button[data-view]').forEach(b => b.addEventListener('click', () => { show(b.dataset.view); window.scrollTo(0, 0); }));
  window.addEventListener('hashchange', () => setTab(location.hash.slice(1)));
  if (railQ) railQ.addEventListener('input', () => { q = railQ.value.trim().toLowerCase(); render(); });
  document.addEventListener('keydown', ev => { if (ev.key !== '/' || ev.metaKey || ev.ctrlKey) return; const t = ev.target; if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
    const qi = document.getElementById('libQ'); if (qi) { ev.preventDefault(); qi.focus(); } });
  tab = ['initiatives', 'potential'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'all';
  (async () => { try { await MismoStore.types.load(); } catch (e) {} render(); loadPotential(); loadRosters(); })();

  // --- Narrowing the sections to icons: the button, or the backslash key ---
  const railHide = document.getElementById('railHide');
  function setMini(on){
    document.documentElement.classList.toggle('railmini', on);
    railHide.setAttribute('aria-label', on ? 'Widen the sections' : 'Narrow the sections');
    railHide.title = (on ? 'Widen the sections' : 'Narrow the sections') + ' (backslash)';
    try { localStorage.setItem('resources:hub:rail', on ? 'mini' : 'full'); } catch (e) {}
  }
  railHide.addEventListener('click', () => setMini(!document.documentElement.classList.contains('railmini')));
  document.addEventListener('keydown', e => {
    if (e.key !== '\\' || e.metaKey || e.ctrlKey || e.altKey) return;
    const t = e.target; if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
    e.preventDefault(); setMini(!document.documentElement.classList.contains('railmini'));
  });
  if (document.documentElement.classList.contains('railmini')) setMini(true);


  // Fun intro touch: briefly highlight each domain tile in turn when triggered (see the
  // replay button below - nothing plays automatically on page load), purely visual — it
  // never sets activeDomain or calls renderPanel, so it can't accidentally open a panel
  // or leave a domain selected once it finishes.
  // Simple synth for the intro tour's tones — pure sine waves, soft envelope,
  // no external audio files needed.
  let audioCtx = null;
  function getAudioContext(){
    if (!audioCtx){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      audioCtx = new Ctx();
    }
    return audioCtx;
  }

  function playTone(freq, startTime, duration, ctx){
    const osc = ctx.createOscillator();
    const gainNode = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, startTime);
    osc.connect(gainNode);
    gainNode.connect(ctx.destination);

    // Soft attack/release so each tone feels muted rather than a hard beep.
    const peak = 0.12;
    gainNode.gain.setValueAtTime(0, startTime);
    gainNode.gain.linearRampToValueAtTime(peak, startTime + 0.08);
    gainNode.gain.setValueAtTime(peak, startTime + duration - 0.15);
    gainNode.gain.linearRampToValueAtTime(0, startTime + duration);

    osc.start(startTime);
    osc.stop(startTime + duration);
  }

  /* The Color Tour, over the eight domains (Perry, 6 Nov 2026): each lights up in turn on a rising scale, then all
     together on a chord. It used to run over a 3x3 grid of domain tiles. */
  function playIntroColorTour(withSound){
    const rows = [...document.querySelectorAll('#view-library .lb-dom')];
    const ctx = withSound ? getAudioContext() : null, live = () => ctx && ctx.state === 'running';
    const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25], step = 420;   // C major, one per domain
    rows.forEach((row, i) => setTimeout(() => {
      row.classList.add('intro-highlight'); if (live()) playTone(notes[i % notes.length], ctx.currentTime, 0.35, ctx);
      setTimeout(() => row.classList.remove('intro-highlight'), step + 200);
    }, i * step));
    setTimeout(() => {
      rows.forEach(r => r.classList.add('intro-highlight')); if (live()) [261.63, 329.63, 392.00].forEach(f => playTone(f, ctx.currentTime, 0.9, ctx));
      setTimeout(() => rows.forEach(r => r.classList.remove('intro-highlight')), 900);
    }, rows.length * step + 250);
  }

  let audioWarmedUp = false;
  function primeAudio(ctx){
    const osc = ctx.createOscillator();
    const gainNode = ctx.createGain();
    gainNode.gain.value = 0.0001;
    osc.connect(gainNode);
    gainNode.connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.02);
  }

  const replayBtn = document.getElementById('replayTourBtn');
  // Guards against a rapid double-click stacking two tours' setTimeouts and class
  // toggles on top of each other. 10s is a generous upper bound - even the longest
  // case (9 rows on a narrow mobile layout, each 975ms apart, plus the ascending
  // phase after) finishes well within it.
  let tourRunning = false;
  if (replayBtn){
    replayBtn.addEventListener('click', async () => {
      if (tourRunning) return;
      tourRunning = true;
      libReset();
      setTimeout(() => { tourRunning = false; }, 10000);
      const ctx = getAudioContext();
      if (ctx && ctx.state === 'suspended'){
        try {
          await ctx.resume();
        } catch (err) {
          // If resume() is ever rejected, fall through anyway — the tour still
          // runs visually, and audioIsLive() checks the real state at each
          // step rather than assuming this succeeded.
        }
      }
      if (ctx && !audioWarmedUp){
        audioWarmedUp = true;
        primeAudio(ctx);
        setTimeout(() => playIntroColorTour(true), 120);
      } else {
        playIntroColorTour(true);
      }
    });
  }

  // Dark mode: check for a saved preference (this is a real hosted site, not a
  // sandboxed preview, so localStorage works normally and persists across visits).
  const themeToggleBtn = document.getElementById('themeToggleBtn');
  const MOON = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6.4 6.4 0 009 9 9 9 0 11-9-9z"/></svg>';
  const SUN = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.1"/><path d="M12 2.4v2.3M12 19.3v2.3M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.4 12h2.3M19.3 12h2.3M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg>';
  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    const dark = theme === 'dark';
    themeToggleBtn.innerHTML = (dark ? SUN : MOON) + `<span>${dark ? 'Light Mode' : 'Dark Mode'}</span>`;
    themeToggleBtn.title = dark ? 'Switch to light mode' : 'Switch to dark mode';
  }
  let savedTheme = 'light';
  try {
    savedTheme = localStorage.getItem('resources:hub:theme') || 'light';
  } catch (e) {
    // Local storage unavailable — just default to light mode.
  }
  applyTheme(savedTheme);

  themeToggleBtn.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    const next = current === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try {
      localStorage.setItem('resources:hub:theme', next);
    } catch (e) {
      // Local storage unavailable — the toggle still works, it just won't persist.
    }
  });
</script>
